<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Summary Component || Frontend Mentor</title>
    <!--CSS styles-->
    <link rel="stylesheet" href="order.css" />
    <!--Typography-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <!--Tab image-->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  </head>
  <body>
    <!--card main content-->
    <div class="card">
      <img src="illustration-hero.svg" id="image-size" />
      <div class="card-content">
        <h2 class="title">Order Summary</h2>
        <p class="card-description">
          You can now listen to millions of songs, audiobooks, and podcasts on
          any device anywhere you like!
        </p>
        <div class="payment">
          <div class="payment-price">
            <div class="payment-summary">
              <img src="icon-music.svg"  class="img-music"/>
              <div>
                <p class="annual-plan">Annual Plan</p>
                <p class="price-year">$59.99/year</p>
              </div>
            </div>

            <a href="#" class="link">Change</a>
          </div>
        </div>
        <div class="btn-footer">
          <button class="payment-btn">Proceed to Payment</button>
          <button class="payment-cancel-order-btn">Cancel Order</button>
        </div>
        
      </div>
    </div>
  </body>
</html>
